<text class="titulo" x="640" y="66" text-anchor="middle" font-size="44" font-weight="bold" fill="#1b2a5c">Modelo Entidad-Relación – Compras y Recepción</text>
<g class="relacion" data-relacion="proveedor-ordenCompra" data-origen="proveedor" data-destino="ordenCompra" data-cardinalidad="1:N" data-estilo="solida">
<path class="linea" d="M330,207.2 L490,207.2" fill="none" stroke="#1b2a5c" stroke-width="2"/>
<line class="extremo-uno" x1="340" y1="215.2" x2="340" y2="199.2" stroke="#1b2a5c" stroke-width="2"/>
<circle cx="350" cy="207.2" r="4" fill="#1b2a5c"/>
<path class="pata-gallo" d="M490,198.2 L474,207.2 L490,216.2 M474,207.2 L490,207.2" fill="none" stroke="#1b2a5c" stroke-width="2"/>
<text class="cardinalidad" data-extremo="origen" x="364" y="198.2" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a5c">1</text>
<text class="cardinalidad" data-extremo="destino" x="456" y="198.2" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a5c">N</text>
<text class="anotacion" text-anchor="middle" font-size="15" fill="#1b2a5c"><tspan x="410" y="234.02">Un proveedor</tspan><tspan x="410" y="253.02">puede tener</tspan><tspan x="410" y="272.02">muchas órdenes de</tspan><tspan x="410" y="291.02">compra.</tspan></text>
</g>
<g class="relacion" data-relacion="ordenCompra-recepcion" data-origen="ordenCompra" data-destino="recepcion" data-cardinalidad="1:N" data-estilo="solida">
<path class="linea" d="M830,284.6 L990,284.6" fill="none" stroke="#1b2a5c" stroke-width="2"/>
<line class="extremo-uno" x1="840" y1="292.6" x2="840" y2="276.6" stroke="#1b2a5c" stroke-width="2"/>
<circle cx="850" cy="284.6" r="4" fill="#1b2a5c"/>
<path class="pata-gallo" d="M990,275.6 L974,284.6 L990,293.6 M974,284.6 L990,284.6" fill="none" stroke="#1b2a5c" stroke-width="2"/>
<text class="cardinalidad" data-extremo="origen" x="864" y="275.6" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a5c">1</text>
<text class="cardinalidad" data-extremo="destino" x="956" y="275.6" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a5c">N</text>
<text class="anotacion" text-anchor="middle" font-size="15" fill="#1b2a5c"><tspan x="910" y="311.42">Una orden de</tspan><tspan x="910" y="330.42">compra puede</tspan><tspan x="910" y="349.42">tener una o varias</tspan><tspan x="910" y="368.42">recepciones.</tspan></text>
</g>
<g class="relacion" data-relacion="ordenCompra-producto" data-origen="ordenCompra" data-destino="producto" data-cardinalidad="N:M" data-estilo="punteada">
<path class="linea" d="M660,692 L660,827 L340,827" fill="none" stroke="#1b2a5c" stroke-width="2" stroke-dasharray="7 6"/>
<path class="pata-gallo" d="M651,692 L660,708 L669,692 M660,708 L660,692" fill="none" stroke="#1b2a5c" stroke-width="2"/>
<path class="pata-gallo" d="M340,836 L356,827 L340,818 M356,827 L340,827" fill="none" stroke="#1b2a5c" stroke-width="2"/>
<text class="cardinalidad" data-extremo="origen" x="672" y="731.95" text-anchor="start" font-size="17" font-weight="bold" fill="#1b2a5c">N</text>
<text class="cardinalidad" data-extremo="destino" x="374" y="818" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a5c">M</text>
<text class="anotacion" text-anchor="middle" font-size="15" fill="#1b2a5c"><tspan x="564.22" y="853.82">Relación conceptual: una orden puede incluir muchos</tspan><tspan x="564.22" y="872.82">productos y un producto puede estar en muchas órdenes. Se</tspan><tspan x="564.22" y="891.82">implementa con la entidad intermedia Línea de Detalle.</tspan></text>
</g>
