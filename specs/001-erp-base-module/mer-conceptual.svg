<title>Modelo Entidad-Relación – Compras y Recepción</title>
<defs><filter id="sombra" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1b2a5c" flood-opacity="0.12"/></filter></defs>
